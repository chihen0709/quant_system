version: '3.8'

services:
  quant_bot:
    build: .
    container_name: stock_minervini_bot
    restart: always  # Restart after crashes or reboots.
    environment:
      # Point the app to the external database inside the container.
      - MY_TW_COVERAGE_PATH=/app/My-TW-Coverage
    volumes:
      # Mount local folders for persistent data.
      - ./reports:/app/reports
      - ./models:/app/models
      - ./config:/app/config
      # Keep My-TW-Coverage next to quant_system.
      - ../My-TW-Coverage:/app/My-TW-Coverage
